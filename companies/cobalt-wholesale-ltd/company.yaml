  tagline: Fresh Supply, Reliable Service, Every Day.
  about: We supply a diverse range of chilled, ambient, and specialty food and drink products to cafés, pubs, and
    retail outlets.
  payment_instructions: Pay invoices via BACS, CHAPS, or corporate card; terms are net 30 from invoice date.
  footer: Thank you for trusting Cobalt Wholesale Ltd for your supply needs.
  notes:
  - Thank you for choosing us as your dependable food and beverage partner.
  - We deliver within 24‑48 hours using refrigerated trucks to maintain product freshness.
  - Non‑perishable goods may be returned within 14 days if unopened and in original packaging.
  - Invoices overdue after 30 days incur a 2% monthly late fee.
  - Keep chilled items at 0‑4°C and dry goods away from moisture and direct sunlight.
  - All products meet UK food safety standards; request documentation with each delivery.
