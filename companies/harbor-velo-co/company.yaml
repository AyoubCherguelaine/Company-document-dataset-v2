texts:
  tagline: Ride farther, live lighter with Harbor Velo.
  about: We design and distribute high‑performance bicycles, parts, and accessories for cyclists of all levels across
    the United States.
  payment_instructions: Settle invoices via ACH, credit card, or check within 20 days of invoice date to avoid late
    fees.
  footer: Thank you for riding with Harbor Velo Co.
  notes:
  - Thanks for choosing Harbor Velo Co. – enjoy the ride!
  - All bicycles ship fully assembled and are ready to ride upon arrival.
  - Returns accepted within 30 days with original packaging; restocking fee may apply.
  - Invoices unpaid after 25 days incur a 2% monthly late charge.
  - We warranty frames for 5 years against manufacturing defects; components carry a 1‑year limited warranty.
  - Keep your bike clean, lubricate the chain regularly, and store it indoors to prolong its life.
