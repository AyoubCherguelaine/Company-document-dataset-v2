code: en
currency: USD
decimal_sep: "."
group_sep: ","
currency_format: "{symbol}{amount}"
date_formats: ["{month} {d}, {yyyy}", "{mm}/{dd}/{yyyy}", "{yyyy}-{mm}-{dd}", "{d} {mon} {yyyy}"]
months: [January, February, March, April, May, June, July, August, September, October, November, December]
tax:
  label: Tax
  standard: "0.0825"
  reduced: "0.04"
  reduced_categories: [Dairy Products, Grains/Cereals, Meat/Poultry, Produce, Seafood]
payroll:
  hours: {1: "173.33", 2: "80"}          # by AdventureWorks PayFrequency: 1 monthly, 2 biweekly
  overtime_factor: "1.5"
  deductions:                            # rate on gross pay
    - {label: federal_income_tax, rate: "0.12"}
    - {label: state_income_tax, rate: "0.045"}
    - {label: social_security, rate: "0.062"}
    - {label: medicare, rate: "0.0145"}
  fixed:
    - {label: health_insurance, amount: "85.00"}
    - {label: retirement_401k, rate: "0.04"}
certificate:
  salutation: ["To whom it may concern,", "To whom it may concern:", ""]
  body:
    - "We hereby certify that {name}, born on {birth_date}, has been employed by {company} since {hire_date} and currently holds the position of {job_title} in the {department} department."
    - "This is to certify that {name} has been working for {company} on a full-time basis since {hire_date}, and is currently employed as {job_title} within the {department} department."
    - "{company} confirms that {name} joined the company on {hire_date} and is presently employed as {job_title} ({department})."
  extra:
    - "{name} works on the {shift} shift and remains an active member of our staff at the date of this letter."
    - "The employment is permanent and ongoing at the date of issue."
  closing:
    - "This certificate is issued at the request of the employee for whatever purpose it may serve."
    - "This letter is provided upon request and does not constitute a reference."
  issued: "Issued in {city} on {date}."
