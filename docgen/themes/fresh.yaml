table_style: striped
logo_shape: rounded
spacing: 1.15
colors:
  primary: "#0f766e"
  accent: "#14b8a6"
  header_bg: "#ccfbf1"
  header_fg: "#134e4a"
  stripe: "#f0fdfa"
  surface: "#f0fdfa"
  border: "#99f6e4"
