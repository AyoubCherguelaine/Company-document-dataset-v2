base_size: 7.8pt
title_size: 18pt
table_style: grid
logo_shape: square
colors:
  primary: "#262626"
  accent: "#b45309"
  header_bg: "#e5e5e5"
  header_fg: "#111111"
  border: "#a3a3a3"
  surface: "#f5f5f5"
